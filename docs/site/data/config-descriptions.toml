# Human-written prose for the generated configuration reference.
#
# `[intro]` holds one short paragraph per TOML section (and one for the
# root-level scalars). `[descriptions]` holds one sentence per dotted config
# path, keyed exactly as `cargo run --bin docs-gen` derives it by walking
# `Config::default()`. A key present in the defaults without an entry here,
# or an entry here that matches no key, is a hard build error (see
# src/bin/docs-gen.rs).
#
# Read the field's consumer before writing or editing a sentence here; do
# not describe the TOML shape, describe the observable behavior.

[intro]
root = "Options that live at the top level of the file, outside any `[section]`."
theme = "Sixteen ANSI colors plus cursor, selection, and contrast tuning for the active palette. Baud ships with the claude-dark preset; override any key here, or pick a different one with `theme = \"name\"`."
font = "Typeface, size, and glyph placement used by the GPU text renderer."
window = "Startup size, decorations, opacity, and padding of the terminal window."
selection = "Mouse selection behavior: what counts as a word, when selecting also copies, and which modifiers bypass the running program's own mouse reporting."
copy_mode = "Vim-style keyboard-driven selection mode."
scrollback = "How much terminal history is kept, and how fast the mouse wheel moves through it."
cursor = "Cursor color, shape, and blink timing."
process = "The child process spawned in the PTY: which shell, with what arguments and environment, and, on Windows, an optional WSL target."
notifications = "Desktop notifications requested by the running program via OSC 9 / OSC 777."
panes = "Split-pane layout, using the same dwindle algorithm as Hyprland."
status = "Appearance of the transient status overlay shown for things like clipboard confirmations."
diagnostics = "Local troubleshooting: the event-loop watchdog, log level, and opt-in crash reporting."
debug = "Developer-facing toggles, off by default."
render = "GPU redraw pacing."

[descriptions]
allow_osc52_read = "Allows the running program to read the clipboard via OSC 52; disable if you do not trust every program you run interactively."
bold_is_bright = "Maps SGR bold text to the bright variant of its ANSI color. Equivalent to `[theme].bold_is_bright`, and OR'd with it: either one being true enables the mapping."
remote_control = "Opens a local control socket so other processes on this machine can read the screen and inject keys. Off by default."
keys = "User-defined keybinding overrides, mapping a chord string to an action name; see the keybindings reference for the accepted values on both sides. Empty by default."

"theme.foreground" = "Default text color, used wherever a cell has no explicit SGR foreground."
"theme.background" = "Terminal background color, and the color the window clears to before each frame."
"theme.cursor" = "Fallback cursor color, used unless `[cursor].color` overrides it."
"theme.selection_bg" = "Background color of selected text. Unset falls back to a semi-transparent `theme.black`."
"theme.selection_fg" = "Foreground color of selected text."
"theme.black" = "ANSI color 0 (SGR 30/40) and its background counterpart."
"theme.red" = "ANSI color 1 (SGR 31/41) and its background counterpart."
"theme.green" = "ANSI color 2 (SGR 32/42) and its background counterpart."
"theme.yellow" = "ANSI color 3 (SGR 33/43) and its background counterpart."
"theme.blue" = "ANSI color 4 (SGR 34/44) and its background counterpart."
"theme.magenta" = "ANSI color 5 (SGR 35/45) and its background counterpart."
"theme.cyan" = "ANSI color 6 (SGR 36/46) and its background counterpart."
"theme.white" = "ANSI color 7 (SGR 37/47) and its background counterpart."
"theme.bright_black" = "ANSI color 8 (SGR 90/100), the bright variant of black; also used as the comment/dim reference color."
"theme.bright_red" = "ANSI color 9 (SGR 91/101), the bright variant of red."
"theme.bright_green" = "ANSI color 10 (SGR 92/102), the bright variant of green."
"theme.bright_yellow" = "ANSI color 11 (SGR 93/103), the bright variant of yellow."
"theme.bright_blue" = "ANSI color 12 (SGR 94/104), the bright variant of blue."
"theme.bright_magenta" = "ANSI color 13 (SGR 95/105), the bright variant of magenta."
"theme.bright_cyan" = "ANSI color 14 (SGR 96/106), the bright variant of cyan."
"theme.bright_white" = "ANSI color 15 (SGR 97/107), the bright variant of white."
"theme.bold_is_bright" = "Maps SGR bold text to the bright variant of its ANSI color. Same switch as the root-level `bold_is_bright`, OR'd together with it."
"theme.dim_alpha" = "Renders SGR dim by fading the glyph's alpha instead of darkening its RGB color."
"theme.minimum_contrast" = "Minimum WCAG contrast ratio enforced between foreground and effective background per cell. `1.0` disables the adjustment and keeps raw theme colors; `3.0` is the large-text floor; `4.5` matches WCAG AA body text."

"font.family" = "Font family name, resolved through fontdb. Defaults to a Nerd Font on Linux and Cascadia Mono on Windows, so box-drawing and Powerline glyphs render without extra setup."
"font.size" = "Font size in points."
"font.glyph_offset.x" = "Fine horizontal pixel offset applied to every glyph within its cell, for fonts whose glyphs need nudging."
"font.glyph_offset.y" = "Fine vertical pixel offset applied to every glyph within its cell, for fonts whose baseline needs nudging."
"font.line_height" = "Line height multiplier applied to the cell grid."
"font.builtin_box_drawing" = "Draws box-drawing (U+2500-U+259F) and Powerline separator (U+E0B0-U+E0B3) glyphs procedurally instead of relying on the font to include them."
"font.ligatures" = "Enables multi-character ligature shaping. Off by default, since ligatures can visually merge adjacent operators in code."
"font.text_contrast" = "Strength of the contrast curve baked into the glyph mask at rasterization time (0.0 to 1.0, default 0.6). On dark themes it thickens strokes and on light themes it thins them, following the theme's polarity. `0.0` disables the curve. The mask is shared across all cell colors, so the curve cannot adapt to each cell's specific fg/bg pair."
"font.fallback" = "Fallback font families tried in order when the primary family is missing a glyph, such as emoji, CJK, or symbol fonts."

"window.opacity" = "Window opacity from 0 to 1. Values below 1 let the desktop show through the background wherever the GPU backend supports transparency."
"window.padding_x" = "Extra horizontal pixels of blank space between the window edge and the terminal grid."
"window.padding_y" = "Extra vertical pixels of blank space between the window edge and the terminal grid."
"window.decorations" = "Window decorations: \"system\" uses the native title bar, \"custom\" draws Baud's unified title bar with inline tabs and window controls, and \"none\" removes decorations entirely. The previous boolean values still work: true maps to \"system\" and false to \"none\"."
"window.startup" = "Initial window state: \"windowed\", \"maximized\", or \"fullscreen\"."
"window.width" = "Initial window width in logical pixels. Only applies when `startup` is \"windowed\"."
"window.height" = "Initial window height in logical pixels. Only applies when `startup` is \"windowed\"."
"window.app_id" = "Wayland app_id and X11 WM_CLASS instance/class. Applied when the window is created. Default \"baud\". The --app-id CLI flag overrides this value. Changing it requires a restart."

"selection.copy_on_select" = "Copies the selection to the clipboard automatically when the left mouse button is released."
"selection.copy_on_select_target" = "Clipboard destination for copy-on-select: \"primary\", \"clipboard\", or \"both\"."
"selection.copy_on_select_delay_ms" = "Delay after releasing the mouse button before copy-on-select fires, so a click that is about to extend into a drag is not copied prematurely."
"selection.bypass_mouse_reporting_modifiers" = "Modifier keys that suppress the running program's own mouse reporting so Baud's selection takes over instead, even in mouse-aware apps like vim or tmux."
"selection.smart_selection" = "Expands a double-click to a whole URL, path, or email address instead of stopping at the nearest delimiter."
"selection.word_delimiters" = "Characters treated as word boundaries for a non-smart double-click selection."

"copy_mode.enabled" = "Enables copy mode, letting its keybinding (Ctrl+Shift+X by default) take effect."

"scrollback.lines" = "Maximum number of scrollback lines retained. `0` keeps no history at all."
"scrollback.unlimited" = "Ignores `scrollback.lines` and keeps every line for the life of the session."
"scrollback.multiplier" = "Lines scrolled per mouse wheel tick while browsing normal-screen scrollback."
"scrollback.faux_multiplier" = "Synthetic arrow-key presses sent per mouse wheel tick while an alternate-screen application, such as a pager or editor, owns the scrolling."

"cursor.color" = "Cursor color override; unset uses `[theme].cursor`."
"cursor.style" = "Cursor shape: \"block\", \"bar\", or \"underline\"."
"cursor.blink" = "Makes the cursor blink, independently of SGR 5 blinking text."
"cursor.blink_interval_ms" = "Blink interval in milliseconds, shared by the cursor and SGR 5 blinking text. `0` disables both: the cursor stays solid and blinking text stays visible."

"process.program" = "Shell executable to launch. Defaults to `$SHELL` on Unix or `%COMSPEC%` on Windows."
"process.args" = "Extra arguments passed to the shell on launch."
"process.working_directory" = "Initial working directory for the child process; unset uses Baud's own working directory."
"process.env" = "Extra environment variables merged into the inherited environment. Baud always sets `TERM=xterm-256color` and `COLORTERM=truecolor` after these. Empty by default."
"process.startup_command" = "Command typed into the shell automatically right after it starts."
"process.login" = "Launches the shell as a login shell."
"process.kind" = "Session backend: \"native\" for the platform's own shell, or \"wsl\" to run inside a WSL distribution (Windows only)."
"process.distro" = "WSL distribution to target when `kind` is \"wsl\"; unset uses WSL's default distribution."
"process.wsl_cwd" = "Initial working directory inside the WSL distribution, passed via `--cd`."

"notifications.enabled" = "Shows a desktop notification when the running program emits OSC 9 or OSC 777."

"panes.max" = "Maximum number of panes per tab. `0` means no limit."
"panes.split_width_multiplier" = "Hyprland-style `split_width_multiplier`: biases new splits wider or narrower than an even half."
"panes.smart_split" = "Chooses a new split's orientation from where the mouse is within the pane, like Hyprland's dwindle triangles, instead of always splitting the long axis."
"panes.preserve_split" = "Keeps each pane's split orientation fixed across resizes instead of recalculating it. `smart_split` implies this as well."

"status.duration_ms" = "How long the status overlay stays visible before it auto-dismisses. `0` disables the automatic dismiss."
"status.bg_color" = "Status overlay background color; unset uses a semi-transparent `theme.black`."
"status.fg_color" = "Status overlay text color; unset uses an adjusted `theme.foreground`."

"diagnostics.watchdog" = "Runs a background thread that detects an unresponsive event loop. Requires a restart to take effect."
"diagnostics.latency_probe" = "Measures key-to-presentation latency (from `KeyboardInput` to `frame.present()`), logging p50/p95/p99 every 60 samples. This is a strict lower bound: it excludes keyboard, compositor, and panel latency."
"diagnostics.log_level" = "Default log level for the `baud` tracing target; ignored when `RUST_LOG` is set in the environment."
"diagnostics.reporting.enabled" = "Whether remote crash reporting (Sentry) is turned on; unset means the user has not been asked yet."
"diagnostics.reporting.dsn" = "Sentry DSN to report to; unset uses the DSN baked in at build time (`BAUD_SENTRY_DSN`)."

"debug.fps_counter_enabled" = "Allows the FPS counter overlay to be toggled with its keybinding."

"render.max_fps" = "Maximum redraw rate in frames per second. Unset uses the monitor's native refresh rate; `0` removes the cap entirely."
"render.vsync" = "Synchronize presentation with the monitor refresh rate. Disabling it lowers input latency at the cost of possible tearing."
