name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    # labeled/unlabeled let release-policy re-evaluate release:manual-version
    # without needing a new push after the label lands.
    types: [opened, synchronize, reopened, labeled, unlabeled]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  # Job 1: checks basicos
  checks:
    name: fmt + clippy
    runs-on: ubuntu-latest
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Instalar Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Cachear target/
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true

      - name: Verificar formato
        run: cargo fmt --all -- --check

      - name: Clippy (sin warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Verificar paginas de referencia generadas
        run: cargo run --bin docs-gen -- --check

  # Job 2: tests
  test:
    name: tests
    runs-on: ubuntu-latest
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Instalar Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Cachear target/
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true

      - name: Correr tests
        run: cargo test --all --verbose

  x11-e2e:
    name: x11 e2e
    runs-on: ubuntu-latest
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Instalar Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Cachear target/
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true

      - name: Instalar Xvfb y Vulkan por software
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-vulkan-drivers libvulkan1 libxkbcommon-x11-0 libegl-mesa0

      - name: Test de cierre espontaneo en X11
        env:
          BAUD_X11_E2E: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a cargo test --test x11_close_request -- --nocapture

      - name: Test de control remoto bajo Xvfb
        env:
          BAUD_X11_E2E: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a env -u WAYLAND_DISPLAY -u WAYLAND_SOCKET cargo test --test remote_e2e -- --ignored --nocapture

      - name: Test de query de gráficos bajo Xvfb
        env:
          BAUD_X11_E2E: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a env -u WAYLAND_DISPLAY -u WAYLAND_SOCKET cargo test --test graphics_query_e2e -- --nocapture

  # Job 3: build de release
  build:
    name: build release
    runs-on: ubuntu-latest
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Instalar Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Cachear target/
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true

      - name: Compilar en release
        run: cargo build --release --locked

  # Job 4: gate de compile en Windows
  windows-compile:
    name: windows compile
    runs-on: windows-latest
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Instalar Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Cachear target/
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true

      - name: cargo check (Windows)
        run: cargo check --all-targets

      - name: cargo build (Windows)
        run: cargo build --locked

      - name: Tests de auth/framing del control remoto
        run: cargo test --lib remote::server -- --test-threads=1

      - name: Tests de resolución ConPTY (fallback OS)
        run: cargo test --lib pty::windows -- --test-threads=1

  # Job 5: gate blando de runtime ConPTY en Windows. Headless, sin winit.
  # Soft gate: continue-on-error hasta la ventana de estabilidad.
  windows-conpty:
    name: windows-conpty
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Instalar Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Cachear target/
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true

      - name: Tests de sesión ConPTY (headless)
        shell: pwsh
        run: |
          $maxIntentos = 2
          $codigo = 1
          for ($intento = 1; $intento -le $maxIntentos; $intento++) {
            Write-Host "Intento ${intento} de ${maxIntentos}"
            cargo test --test pty_session_conformance -- --test-threads=1 --nocapture
            $codigo = $LASTEXITCODE
            if ($codigo -eq 0) { break }
            if ($intento -lt $maxIntentos) {
              Write-Host "Reintentando tras fallo (intento ${intento})..."
              Start-Sleep -Seconds 5
            }
          }
          if ($codigo -ne 0) {
            Write-Host "Los tests de sesión ConPTY fallaron tras ${maxIntentos} intentos"
          }
          exit $codigo

      - name: Tests de resolución ConPTY (fallback OS)
        run: cargo test --lib pty::windows -- --test-threads=1 --nocapture

      - name: Descargar par ConPTY pinneado
        shell: pwsh
        run: ./tools/packaging/fetch_conpty_bundle.ps1 -OutDir target/conpty-bundle

      - name: Test de resolución ConPTY empaquetado
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $deps = "target/debug/deps"
          New-Item -ItemType Directory -Force -Path $deps | Out-Null
          Copy-Item "target/conpty-bundle/conpty.dll" $deps
          Copy-Item "target/conpty-bundle/OpenConsole.exe" $deps
          cargo test --lib con_dll_junto_al_exe_se_usa_el_par_empaquetado -- --ignored --exact --nocapture

      - name: Activar WER LocalDumps
        shell: pwsh
        run: |
          $key = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps"
          New-Item -Path $key -Force | Out-Null
          Set-ItemProperty $key DumpFolder "$env:GITHUB_WORKSPACE\dumps" -Type ExpandString
          Set-ItemProperty $key DumpType 2 -Type DWord
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\dumps" | Out-Null

      - name: Capturar stderr del test de cierre
        shell: pwsh
        run: |
          cargo test --release --test windows_close_e2e -- --ignored --nocapture 2>&1 | Tee-Object -FilePath windows_close_e2e.stderr.txt
          $codigo = $LASTEXITCODE
          $logSrc = Join-Path $env:LOCALAPPDATA "baud\logs"
          if (Test-Path $logSrc) {
            New-Item -ItemType Directory -Force -Path baud-logs | Out-Null
            Copy-Item -Path (Join-Path $logSrc "*") -Destination baud-logs -Recurse -Force
          }
          exit $codigo

      - name: Subir artifacts de diagnostico
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-close-e2e-diagnostics
          path: |
            dumps/
            windows_close_e2e.stderr.txt
            baud-logs/
          if-no-files-found: ignore

  # Job 6: smoke X11 bajo xvfb.
  xvfb-smoke:
    name: xvfb X11 smoke
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Instalar Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Cachear target/
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true

      - name: Instalar xvfb + deps X11 + Mesa software
        run: sudo apt-get update && sudo apt-get install -y xvfb libxkbcommon-x11-0 mesa-vulkan-drivers libegl-mesa0

      - name: Smoke X11 (sin Wayland)
        env:
          WAYLAND_DISPLAY: ""
          WAYLAND_SOCKET: ""
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          unset WAYLAND_DISPLAY WAYLAND_SOCKET || true
          chmod +x tools/linux_session_smoke.sh
          tools/linux_session_smoke.sh --xvfb --build

  release-policy:
    name: release policy
    runs-on: ubuntu-latest
    # This gate reads PR labels, which only exist pre-merge. Skip it on
    # push (e.g. after merge) so a manual x/y release never fails here.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # The policy baseline is the latest vX.Y.Z tag, so tags must be
          # present even though this job doesn't need full commit history.
          fetch-tags: true

      - name: Verify automated version policy
        env:
          # Add release:manual-version only to an intentionally reviewed Y or X bump.
          RELEASE_MANUAL_VERSION: ${{ contains(github.event.pull_request.labels.*.name, 'release:manual-version') }}
        run: tools/ci/verify_release_policy.sh

  # Job 8: shell packaging fixtures — valida perfil del tarball e installer
  shell-fixtures:
    name: shell packaging fixtures
    runs-on: ubuntu-latest
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Validate desktop entry source
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq desktop-file-utils
          desktop-file-validate packaging/linux/baud.desktop
          grep -q '^X-TerminalArgExec=-e$' packaging/linux/baud.desktop
          grep -q '^X-TerminalArgDir=--working-directory=$' packaging/linux/baud.desktop

      - name: Release asset verifier suite
        run: bash tools/ci/test_release_assets.sh

      - name: Installer fixture suite
        run: bash tools/ci/test_install_release.sh
