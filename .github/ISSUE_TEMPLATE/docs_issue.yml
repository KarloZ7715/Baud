name: Documentation issue
description: Report a mistake or gap in the documentation site.
labels: ["docs"]
body:
  - type: input
    id: page
    attributes:
      label: Page path
      description: Which page is affected? Include the path under `docs/site/src/` if you know it.
      placeholder: "help/troubleshooting.md"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is wrong, missing, or confusing?
    validations:
      required: true
