[package]
name = "baud-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
toml = "1"
vte = "0.15"

[dependencies.baud]
path = ".."

# Use independent workspace for fuzzers
[workspace]
members = ["."]

[[bin]]
name = "parser_feed"
path = "fuzz_targets/parser_feed.rs"
test = false
doc = false
bench = false

[[bin]]
name = "feed_and_resize"
path = "fuzz_targets/feed_and_resize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "theme_import"
path = "fuzz_targets/theme_import.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_toml"
path = "fuzz_targets/config_toml.rs"
test = false
doc = false
bench = false
