[package]
name = "baud"
version = "0.1.2"
edition = "2021"
rust-version = "1.87.0"
description = "A fast, feature-rich, GPU-accelerated, cross-platform terminal emulator"
license = "Apache-2.0"
repository = "https://github.com/KarloZ7715/Baud"
readme = "README.md"
authors = ["KarloZ7715"]
keywords = ["terminal", "emulator", "gpu", "wgpu"]
categories = ["command-line-utilities"]

[profile.release]
lto = "thin"
codegen-units = 1

[dependencies]
winit = "0.30"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
vte = "0.15"
wgpu = "29"
glyphon = "0.11"
unicode-script = "0.5"
unicode-segmentation = "1.13"
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "1"
toml_edit = "0.22"
dirs = "6"
oklab = "1.1.2"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
serde_json = "1"
ureq = "3"
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
flate2 = "1"
tar = "0.4"
tempfile = "3"
sys-locale = "0.3.2"
tracing-appender = "0.2.5"
notify-rust = { version = "~4.17.0", default-features = false, features = ["z"] }
# Promovido a dependencia directa: ya venía en el árbol por notify-rust
# (feature `z`), así que no añade tiempo de compilación. Lo usa el watcher
# del portal XDG `org.freedesktop.appearance` para seguir el modo del SO.
zbus = "5.18"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["term", "fs", "signal", "event", "poll", "user", "process"] }

[target.'cfg(unix)'.dev-dependencies]
x11rb = "0.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Security_Cryptography",
    "Win32_Security_Authorization",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bin]]
name = "tui_dummy"
path = "tools/tui_dummy.rs"
test = false
bench = false
doc = false

[[bench]]
name = "bench"
harness = false

[[bench]]
name = "watchdog_overhead"
harness = false

[patch.crates-io]
winit = { git = "https://github.com/KarloZ7715/winit", branch = "x11-wm-protocols-check" }

[[bench]]
name = "pty_hot_path"
harness = false

[lints.rust]
unused = "warn"

[package.metadata.deb]
maintainer = "KarloZ7715"
copyright = "2026, The Baud Authors"
license-file = ["LICENSE", "4"]
depends = "$auto, libxkbcommon0, libwayland-client0, libx11-6, libxcursor1, libxi6, libxrandr2, libvulkan1, libfontconfig1"
section = "utils"
priority = "optional"
extended-description = """\
A fast, feature-rich, GPU-accelerated, cross-platform terminal emulator \
with multi-session support, tabs, split panes, themes, and clipboard integration.\
"""
assets = [
    ["target/release/baud", "usr/bin/baud", "755"],
    ["packaging/linux/baud.desktop", "usr/share/applications/baud.desktop", "644"],
    ["assets/icons/hicolor/48x48/apps/baud.png", "usr/share/icons/hicolor/48x48/apps/baud.png", "644"],
    ["assets/icons/hicolor/256x256/apps/baud.png", "usr/share/icons/hicolor/256x256/apps/baud.png", "644"],
    ["packaging/man/baud.1", "usr/share/man/man1/baud.1", "644"],
    ["packaging/completions/baud.bash", "usr/share/bash-completion/completions/baud", "644"],
    ["packaging/completions/baud.zsh", "usr/share/zsh/site-functions/_baud", "644"],
    ["packaging/completions/baud.fish", "usr/share/fish/vendor_completions.d/baud.fish", "644"],
    ["LICENSE", "usr/share/doc/baud/LICENSE", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/baud", dest = "/usr/bin/baud", mode = "755" },
    { source = "packaging/linux/baud.desktop", dest = "/usr/share/applications/baud.desktop", mode = "644" },
    { source = "assets/icons/hicolor/*/apps/baud.png", dest = "/usr/share/icons/hicolor/", mode = "644" },
    { source = "packaging/man/baud.1", dest = "/usr/share/man/man1/baud.1", mode = "644" },
    { source = "packaging/completions/baud.bash", dest = "/usr/share/bash-completion/completions/baud", mode = "644" },
    { source = "packaging/completions/baud.zsh", dest = "/usr/share/zsh/site-functions/_baud", mode = "644" },
    { source = "packaging/completions/baud.fish", dest = "/usr/share/fish/vendor_completions.d/baud.fish", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/doc/baud/LICENSE", mode = "644" },
]

[package.metadata.generate-rpm.requires]
libxkbcommon = "*"
libwayland-client = "*"
libX11 = "*"
libXcursor = "*"
libXi = "*"
libXrandr = "*"
vulkan-loader = "*"
fontconfig = "*"
